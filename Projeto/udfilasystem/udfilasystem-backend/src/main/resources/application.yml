spring:
  application:
    name: udfilasystem

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:udfilasystem}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: never
    include-binding-errors: never

security:
  jwt:
    secret: ${JWT_SECRET:mude-essa-chave-secreta-em-producao-use-256bits}
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

app:
  totp:
    issuer: udfilasystem
    window: 1
  rate-limit:
    login-attempts: 5
    login-window-minutes: 15

logging:
  level:
    com.udfilasystem: INFO
    org.springframework.security: WARN
